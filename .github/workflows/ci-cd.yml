name: Backend CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ========================================
  # CI：ビルド・テスト
  # ========================================
  ci:
    name: Backend CI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ソースコードの取得
      - name: Checkout source code
        uses: actions/checkout@v5

      # Java実行環境の構築
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # 実行環境の確認
      - name: Check environment
        run: |
          java -version
          mvn -version

      # Mavenビルド・テスト
      - name: Build and test
        run: mvn --batch-mode clean verify

      # JARファイルの存在確認
      - name: Verify build artifact
        run: |
          test -s target/portfolio-backend-0.0.1-SNAPSHOT.jar

      # ビルド成果物の保存
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-backend
          path: target/portfolio-backend-0.0.1-SNAPSHOT.jar
          retention-days: 7
          if-no-files-found: error

  # ========================================
  # CD：AWSへの自動デプロイ
  # ========================================
  deploy:
    name: Deploy Backend to AWS

    # CIが成功した場合のみ実行
    needs: ci

    # mainブランチへのPushまたは手動実行のみ
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    runs-on: ubuntu-latest
    timeout-minutes: 75

    permissions:
      contents: read
      id-token: write

    # バックエンドの同時デプロイを防止
    concurrency:
      group: portfolio-backend-production
      cancel-in-progress: false

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      SSM_DOCUMENT_NAME: Portfolio-Deploy-Backend
      COMMIT_SHA: ${{ github.sha }}

    steps:
      # OIDCによるAWS認証
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 5400

      # AWS認証情報の確認
      - name: Verify AWS identity
        shell: bash
        run: aws sts get-caller-identity

      # SSMを利用したデプロイ実行
      - name: Execute deployment
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          echo "Target commit: $COMMIT_SHA"

          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit SHA."
            exit 1
          fi

          COMMAND_ID=$(aws ssm send-command \
            --document-name "$SSM_DOCUMENT_NAME" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --parameters "CommitSha=$COMMIT_SHA" \
            --timeout-seconds 120 \
            --comment "GitHub Actions Backend Deployment" \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # デプロイ完了まで待機
      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail

          for i in $(seq 1 400); do

            if ! STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text); then

              sleep 10
              continue
            fi

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                echo "Deployment completed."
                exit 0
                ;;

              Pending|InProgress|Delayed|Cancelling)
                sleep 10
                ;;

              *)
                echo "Deployment failed: $STATUS"
                exit 1
                ;;
            esac

          done

          echo "Deployment timed out."
          exit 1

      # デプロイ結果の出力
      - name: Show deployment result
        if: always() && steps.deploy.outputs.command_id != ''
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
            --output json
